// Top-level build file where you can add configuration options common to all sub-projects/modules.
// Gradle 9.4.1 + AGP 9.2.1 (läuft auch mit dem Java 25 von Android Studio); die Capacitor-Module
// sind für AGP 8 geschrieben – dafür stehen in gradle.properties die beiden Kompatibilitäts-Schalter.

buildscript {
    ext.agpVersion = '9.2.1'
    ext.kotlin_version = '2.2.10'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$agpVersion"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
